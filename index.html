<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>

input{font:inherit;width:100%;box-sizing:border-box;padding:8px;background:#06121f;color:var(--fg);border:1px solid var(--p);border-radius:6px;margin:4px 0}

small{opacity:.7}
</style></head><body>
<canvas id="cv"></canvas>
<div id="ui">
 <div id="prog"></div>
 <div id="xrbar"><button id="vrbtn" style="display:none">ENTER VR</button><button id="arbtn" style="display:none">TRY ROOM AR</button><div id="xrstatus" class="box"></div></div>
 <div id="main" class="box c"><h1>THE JOURNEY OF A DATA PACKET</h1><p>“Every message you send travels through an invisible world.”<br>“Today, you won’t just learn how data travels. You will become the data.”</p><button id="start">START JOURNEY</button><p><small>WASD / drag to look / E to interact · touch: ▲▼ buttons</small></p></div>
 <div id="hint" class="box b" style="display:none"></div>
 <div id="panel" class="box c" style="display:none"></div>

  <div class="mid"><button id="l" aria-label="Move left">◀</button><button id="k" aria-label="Move backward">▼</button><button id="r" aria-label="Move right">▶</button></div>
 </div>
 <button id="act" class="b" style="display:none;bottom:70px">INTERACT (E)</button>
 <button id="full">FULL SCREEN</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/7.0.0/babylon.min.js"></script>
<script>
const B=BABYLON,$=i=>document.getElementById(i);
const LAYERS=["Application","Presentation","Session","Transport","Network","Data Link","Physical"];
let stage="menu",msg="Tum kaisi ho?",solved=false,mvF=0,mvS=0,tab=0;
const eng=new B.Engine($("cv"),true),sc=new B.Scene(eng);
sc.clearColor=new B.Color4(.01,.02,.05,1);sc.fogMode=B.Scene.FOGMODE_EXP2;sc.fogDensity=.012;sc.fogColor=new B.Color3(.01,.02,.05);
const cam=new B.UniversalCamera("c",new B.Vector3(0,1.7,-30),sc);cam.setTarget(new B.Vector3(0,1.7,0));cam.attachControl($("cv"),true);
// ---- WEBXR: VR + PHONE AR ----
// VR needs a compatible headset. Phone AR can work on supported Android/Chrome + ARCore.
let xrExperience=null,xrReady=false,xrInSession=false,xrMode="",lastXRStage="";
let arHitTest=null,arRoot=null,arLocked=false,arSavedVisibility=[],arOldClear=null,arLastResult=null;
const vrBtn=$("vrbtn"),arBtn=$("arbtn"),xrStatus=$("xrstatus");
function xrMessage(t,show=true){xrStatus.textContent=t;xrStatus.style.display=show?"block":"none"}
function makeARShowcase(){
  if(arRoot)return;
  arRoot=new B.TransformNode("AR_OSI_Lab",sc);arRoot.rotationQuaternion=B.Quaternion.Identity();arRoot.scaling.setAll(.16);arRoot.setEnabled(false);
  const mm=(name,color,glow)=>{const m=new B.StandardMaterial(name,sc);m.diffuseColor=B.Color3.FromHexString(color);m.emissiveColor=B.Color3.FromHexString(glow||color);return m};
  const base=B.MeshBuilder.CreateCylinder("AR_table",{diameter:8,height:.22,tessellation:48},sc);base.parent=arRoot;base.position.y=.12;base.material=mm("AR_base_mat","#101b30","#123b55");
  const rim=B.MeshBuilder.CreateTorus("AR_rim",{diameter:7.7,thickness:.09,tessellation:48},sc);rim.parent=arRoot;rim.position.y=.28;rim.material=mm("AR_rim_mat","#38e1ff","#38e1ff");
  const title=holo("THE OSI DATA JOURNEY",5.8,.7,B.Vector3.Zero(),"#38e1ff");title.parent=arRoot;title.position.set(0,5.2,0);title.isPickable=false;
  const names=["APPLICATION","PRESENTATION","SESSION","TRANSPORT","NETWORK","DATA LINK","PHYSICAL"];
  const colors=["#38e1ff","#a56bff","#ffb347","#39d98a","#f36b8a","#4db6ff","#ffe066"];
  names.forEach((n,i)=>{
    const y=.55+i*.52;
    const disk=B.MeshBuilder.CreateCylinder("AR_layer_"+i,{diameter:4.9-i*.22,height:.38,tessellation:40},sc);disk.parent=arRoot;disk.position.set(0,y,0);
    disk.material=mm("AR_layer_mat_"+i,colors[i],colors[i]);disk.metadata={arLayer:i};
    const label=holo((7-i)+" · "+n,3.8,.42,B.Vector3.Zero(),colors[i],{arLayer:i});label.parent=arRoot;label.position.set(0,y+.24,-2.35);label.isPickable=true;
  });
  const packet=B.MeshBuilder.CreateSphere("AR_packet",{diameter:.85,segments:20},sc);packet.parent=arRoot;packet.position.set(0,5.25,0);packet.material=mm("AR_packet_mat","#ffffff","#38e1ff");
  const note=holo("TAP A LAYER TO EXPLORE",4.5,.45,B.Vector3.Zero(),"#ffffff");note.parent=arRoot;note.position.set(0,6.2,0);note.isPickable=false;
}
function isInsideAR(node){while(node){if(node===arRoot)return true;node=node.parent}return false}
function prepareARScene(){
  arSavedVisibility=[];
  sc.meshes.forEach(m=>{if(!isInsideAR(m)){arSavedVisibility.push([m,m.isVisible]);m.isVisible=false}});
  arOldClear=sc.clearColor.clone();sc.clearColor=new B.Color4(0,0,0,0);
  arRoot.setEnabled(true);arLocked=false;arLastResult=null;
  xrMessage("AR camera active. Slowly point at a textured floor or table. When the marker appears, tap the screen to place the OSI model.");
}
function restoreARScene(){
  arSavedVisibility.forEach(([m,v])=>{if(!m.isDisposed())m.isVisible=v});arSavedVisibility=[];
  if(arOldClear)sc.clearColor=arOldClear;arOldClear=null;
  if(arRoot)arRoot.setEnabled(false);arLocked=false;arLastResult=null;
}
async function setupWebXR(){
  if(!window.isSecureContext){xrMessage("AR/VR needs HTTPS (or localhost for development). Desktop 3D still works.");return}
  if(!navigator.xr||!navigator.xr.isSessionSupported){xrMessage("This browser does not expose WebXR. Normal 3D mode is ready.");return}
  try{
    const [vrOK,arOK]=await Promise.all([navigator.xr.isSessionSupported("immersive-vr").catch(()=>false),navigator.xr.isSessionSupported("immersive-ar").catch(()=>false)]);
    if(!vrOK&&!arOK){xrMessage("No immersive XR mode detected here. Try Android Chrome with ARCore for phone AR, or a compatible VR headset.");return}
    makeARShowcase();
    xrExperience=await sc.createDefaultXRExperienceAsync({disableTeleportation:true,uiOptions:{sessionMode:arOK?"immersive-ar":"immersive-vr",referenceSpaceType:arOK?"local":"local-floor"},optionalFeatures:["hit-test"]});
    if(!xrExperience||!xrExperience.baseExperience){xrMessage("WebXR could not initialize. Normal 3D mode remains available.");return}
    xrReady=true;
    if(vrOK)vrBtn.style.display="inline-block";
    if(arOK)arBtn.style.display="inline-block";
    if(arOK){
      try{arHitTest=xrExperience.baseExperience.featuresManager.enableFeature("xr-hit-test","latest");
        arHitTest.onHitTestResultObservable.add(results=>{
          if(!xrInSession||xrMode!=="ar"||arLocked||!results.length)return;
          arLastResult=results[0];
          const sca=new B.Vector3(),rot=B.Quaternion.Identity(),pos=new B.Vector3();
          arLastResult.transformationMatrix.decompose(sca,rot,pos);
          arRoot.position.copyFrom(pos);arRoot.rotationQuaternion.copyFrom(rot);arRoot.scaling.setAll(.16);arRoot.setEnabled(true);
          xrMessage("Surface found. Tap once on the camera view to place the OSI lab here.");
        });
      }catch(e){console.warn("AR hit test setup:",e);arHitTest=null;}
    }
    xrExperience.baseExperience.onStateChangedObservable.add(state=>{
      xrInSession=state===B.WebXRState.IN_XR;
      if(xrInSession){
        lastXRStage=stage;
        if(xrMode==="ar")prepareARScene();
        else xrMessage("VR active: turn your head to look around. A compatible headset is required.");
      }else{
        if(xrMode==="ar")restoreARScene();
        xrMode="";lastXRStage="";vrBtn.textContent="ENTER VR";arBtn.textContent="TRY ROOM AR";
        xrMessage("XR session ended. Back to normal 3D mode.");
      }
    });
    xrMessage((arOK?"Phone AR available":"Phone AR not detected")+(vrOK?" · VR available":" · VR headset not detected")+". Choose a mode when ready.");
  }catch(err){console.warn("WebXR initialization:",err);xrMessage("WebXR setup issue: "+(err&&err.message?err.message:"unsupported device/browser")+". Normal 3D mode is still available.");}
}
async function enterXR(mode){
  if(!xrReady||!xrExperience)return;
  try{
    if(xrInSession){await xrExperience.baseExperience.exitXRAsync();return}
    xrMode=mode;
    await xrExperience.baseExperience.enterXRAsync(mode==="ar"?"immersive-ar":"immersive-vr",mode==="ar"?"local":"local-floor");
  }catch(err){xrMode="";console.warn("XR session:",err);xrMessage((mode==="ar"?"Could not start AR. Check Android Chrome, ARCore and camera permission. ":"Could not enter VR. Check headset and browser. ")+(err&&err.message?err.message:""));}
}
vrBtn.onclick=()=>enterXR("vr");
arBtn.onclick=()=>enterXR("ar");
// First tap after the AR surface marker appears fixes the miniature in the real room.
sc.onPointerObservable.add(pi=>{
  if(!xrInSession||xrMode!=="ar"||arLocked||pi.type!==B.PointerEventTypes.POINTERTAP||!arLastResult)return;
  arLocked=true;xrMessage("OSI lab placed in your room. Walk around it carefully and tap a coloured layer to inspect it.");
});
sc.onPointerObservable.add(pi=>{
  if(!xrInSession||xrMode!=="ar"||pi.type!==B.PointerEventTypes.POINTERTAP)return;
  const m=pi.pickInfo&&pi.pickInfo.pickedMesh;
  if(m&&m.metadata&&m.metadata.arLayer!==undefined){const i=m.metadata.arLayer;xrMessage("OSI Layer "+(7-i)+" — "+LAYERS[i]+". This is a tabletop learning model; return to the game to complete the full journey.");}
});
setupWebXR();
cam.keysUp=[87];cam.keysDown=[83];cam.keysLeft=[65];cam.keysRight=[68];cam.speed=.28;cam.angularSensibility=3500;cam.minZ=.1;cam.inertia=.7;
new B.HemisphericLight("h",new B.Vector3(0,1,0),sc).intensity=.35;
new B.GlowLayer("g",sc).intensity=.8;
const mat=(c,e)=>{const m=new B.StandardMaterial("m",sc);m.diffuseColor=B.Color3.FromHexString(c);m.emissiveColor=B.Color3.FromHexString(e||"#000000");return m};
// tiny sound helper
let ac;const beep=(f,d=.15)=>{try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}};
// text textures
function holo(text,w,h,pos,col="#38e1ff",meta){const px=256,t=new B.DynamicTexture("t",{width:px*w,height:px*h},sc,true),x=t.getContext();x.fillStyle="rgba(4,20,40,.85)";x.fillRect(0,0,px*w,px*h);x.strokeStyle=col;x.lineWidth=6;x.strokeRect(3,3,px*w-6,px*h-6);x.fillStyle=col;x.font="bold "+(px*h*.3)+"px monospace";x.textAlign="center";x.fillText(text,px*w/2,px*h*.6);t.update();
 const p=B.MeshBuilder.CreatePlane("p",{width:w,height:h},sc),m=new B.StandardMaterial("pm",sc);m.emissiveTexture=t;m.opacityTexture=t;m.disableLighting=true;p.material=m;p.position=pos;if(meta)p.metadata=meta;return p}
function glyph(c){const t=new B.DynamicTexture("g",64,sc,true),x=t.getContext();x.font="bold 48px monospace";x.fillStyle="#7ff";x.textAlign="center";x.fillText(c,32,50);t.update();return t}
function parts(ch,emitter,n,box,col){const p=new B.ParticleSystem("p",n*3,sc);p.particleTexture=glyph(ch);p.emitter=emitter;p.minEmitBox=new B.Vector3(-box,-box,-box);p.maxEmitBox=new B.Vector3(box,box,box);p.color1=B.Color4.FromHexString(col+"ff");p.color2=new B.Color4(.6,.4,1,1);p.colorDead=new B.Color4(0,0,0,0);p.minSize=.08;p.maxSize=.25;p.minLifeTime=1.5;p.maxLifeTime=4;p.emitRate=n;p.gravity=new B.Vector3(0,.4,0);p.direction1=new B.Vector3(-.5,.5,-.5);p.direction2=new B.Vector3(.5,1.5,.5);p.blendMode=B.ParticleSystem.BLENDMODE_ADD;p.start();return p}
// ---- CAVE ----
const rock=mat("#141a26"),cry=mat("#0a3a66","#1aa0ff");
const g=B.MeshBuilder.CreateGround("gr",{width:50,height:140},sc);g.position.z=40;g.material=rock;
[[-14,1],[14,1]].forEach(([x])=>{const w=B.MeshBuilder.CreateBox("w",{width:4,height:24,depth:140},sc);w.position.set(x,10,40);w.material=rock});
const roof=B.MeshBuilder.CreateBox("r",{width:40,height:3,depth:140},sc);roof.position.set(0,16,40);roof.material=rock;
[-7,7].forEach(x=>{const a=B.MeshBuilder.CreateBox("a",{width:5,height:14,depth:5},sc);a.position.set(x,7,0);a.material=rock});
const lin=B.MeshBuilder.CreateBox("l",{width:20,height:4,depth:5},sc);lin.position.set(0,13,0);lin.material=rock;
for(let i=0;i<46;i++){const c=B.MeshBuilder.CreateCylinder("cr",{height:1+Math.random()*3,diameterTop:0,diameterBottom:.6+Math.random()*.6,tessellation:5},sc);c.position.set((Math.random()<.5?-1:1)*(7+Math.random()*5),.8,-20+Math.random()*80);c.rotation.z=(Math.random()-.5)*.5;c.material=cry}
const pl=new B.PointLight("pl",new B.Vector3(0,4,14),sc);pl.diffuse=new B.Color3(.2,.7,1);pl.intensity=1.2;
const portal=B.MeshBuilder.CreateTorus("po",{diameter:8,thickness:.5},sc);portal.position.set(0,5,60);portal.rotation.x=Math.PI/2;portal.rotation.x=0;portal.material=mat("#222","#a56bff");
parts("·",new B.Vector3(0,4,10),30,10,"#38e1ff").particleTexture=glyph("•");
const term=B.MeshBuilder.CreateBox("term",{width:2.4,height:1.2,depth:.8},sc);term.position.set(0,.6,16);term.material=mat("#0b1b2e","#0a5577");
holo("TERMINAL",2.2,.9,new B.Vector3(0,1.9,15.5));
// human
const hum=new B.TransformNode("hum",sc);hum.position.set(0,0,12.5);hum.setEnabled(false);const hm=mat("#e8b890","#331100");
[["body",B.MeshBuilder.CreateCylinder("b",{height:1.0,diameter:.55},sc),1.05],["head",B.MeshBuilder.CreateSphere("h",{diameter:.4},sc),1.75],["legs",B.MeshBuilder.CreateCylinder("l",{height:.8,diameter:.4},sc),.4]].forEach(([n,m,y])=>{m.parent=hum;m.position.y=y;m.material=hm});
// data entity (attached to camera later)
const ent=B.MeshBuilder.CreateSphere("ent",{diameter:.3},sc);ent.material=mat("#003","#38e1ff");ent.setEnabled(false);ent.parent=cam;ent.position.set(0,-.45,1.2);
// ---- LAYER 7 ROOM ----
const OX=300,room=[];
(function(){const f=B.MeshBuilder.CreateGround("f",{width:30,height:36},sc);f.position.set(OX,0,5);f.material=mat("#0a1420","#06223a");
const w=B.MeshBuilder.CreateBox("w",{width:30,height:12,depth:1},sc);w.position.set(OX,6,22);w.material=mat("#0a1830","#102060");
holo("“"+msg+"”",5,1.4,new B.Vector3(OX,4.5,21.3),"#a56bff").name="screen";
const defs=[["HTTP",-9,false],["HTTPS",-3,true],["DNS",3,false],["SMTP",9,false]];
defs.forEach(([n,x,ok])=>{const p=B.MeshBuilder.CreateCylinder("pil",{height:3,diameter:1.4},sc);p.position.set(OX+x,1.5,12);p.material=mat("#101c30","#0c4a70");p.metadata={proto:n,ok};holo(n,1.8,.7,new B.Vector3(OX+x,3.7,12),"#38e1ff",{proto:n,ok})});})();
// ---- UI helpers ----
const P={done:[],skip:[],cur:-1};function prog(){$("prog").innerHTML=LAYERS.map((n,i)=>{const c=P.done.includes(i)?"done":P.cur==i?"cur":"";return `<span class="${c}">${n}${P.skip.includes(i)?" (soon)":""}</span>`}).join("→")}
prog();
const hint=t=>{$("hint").style.display=t?"block":"none";$("hint").innerHTML=t||""};
const panel=h=>{$("panel").style.display=h?"block":"none";$("panel").innerHTML=h||""};
const fade=(fn)=>{const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#000;opacity:0;transition:opacity .8s;z-index:5";document.body.appendChild(d);requestAnimationFrame(()=>d.style.opacity=1);setTimeout(()=>{fn();d.style.opacity=0;setTimeout(()=>d.remove(),900)},900)};
// ---- FLOW ----
$("start").onclick=()=>{beep(440);$("main").style.display="none";stage="cave";hint("Walk into the cave (WASD). Find the glowing terminal and press <b>E</b>.")};
function act(){if(stage=="cave"&&near(term,5)){stage="terminal";hint();beep(660);
 panel(`<h1>COMMUNICATION TERMINAL</h1><p>Sender: <b>Mumbai, India</b><br>Receiver: <b>Delhi, India</b></p><input id="mi" value="${msg}" maxlength="40"><br><button id="send">SEND</button>`);
 $("send").onclick=()=>{msg=$("mi").value.trim()||"Tum kaisi ho?";panel();transform()}}}
const near=(m,d)=>B.Vector3.Distance(cam.position,m.position)<d;
$("act").onclick=act;addEventListener("keydown",e=>{if(e.key=="e"||e.key=="E")act()});
// Touch movement pad: hold a direction to walk; drag on the scene to look around.
const hold=(id,fn)=>{const el=$(id);el.addEventListener("pointerdown",e=>{e.preventDefault();el.setPointerCapture(e.pointerId);fn(1)});const stop=()=>fn(0);el.addEventListener("pointerup",stop);el.addEventListener("pointercancel",stop);el.addEventListener("lostpointercapture",stop)};
hold("f",v=>mvF=v);hold("k",v=>mvF=-v);hold("l",v=>mvS=-v);hold("r",v=>mvS=v);
addEventListener("blur",()=>{mvF=0;mvS=0});
$("full").onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){hint("Fullscreen is not available in this browser. You can continue in the normal window.")}};
function transform(){stage="trans";const sv=cam.position.clone();hum.setEnabled(true);cam.detachControl();cam.position.set(4,1.6,9);cam.setTarget(new B.Vector3(0,1.1,12.5));
 setTimeout(()=>{hm.emissiveColor=new B.Color3(.2,.8,1);beep(300,.6)},800);
 setTimeout(()=>{const e=hum.getChildMeshes()[0];[0,1].forEach(i=>{});parts("0",hum.getChildMeshes()[0],160,.4,"#38e1ff");parts("1",hum.getChildMeshes()[1],160,.4,"#a56bff");beep(500,.8);
  let s=1;const iv=setInterval(()=>{s-=.04;hum.scaling.setAll(Math.max(s,0));if(s<=0){clearInterval(iv);hum.setEnabled(false)}},60)},1800);
 setTimeout(()=>{panel(`<h1>You are no longer a human.</h1><p style="font-size:20px">You are <b>DATA</b>.</p><button id="go">ENTER THE DIGITAL CAVE</button>`);$("go").onclick=()=>{panel();fade(()=>{ent.setEnabled(true);cam.position.set(OX,1.7,-10);cam.setTarget(new B.Vector3(OX,2.5,12));cam.attachControl($("cv"),true);stage="l7";P.cur=0;prog();layer7()})}},5000)}
function layer7(){hint("LAYER 7 · APPLICATION — a futuristic control room. Your message is on the holo screen. <button id='info'>EXPLAIN</button><br>Scenario: your chat app must send this message across the Internet <b>securely</b>. Click the correct protocol pillar.")
 $("info").onclick=()=>explain()}
const EX=[["The Application Layer gives apps access to network services. WhatsApp is the app; Layer 7 is the set of protocols it speaks. Your message becomes <i>application data</i> ready to be sent.","Protocols: HTTP (web), HTTPS (HTTP over TLS, protected), DNS (name→IP lookup), SMTP (email delivery). Layer 7 is a service interface, not the application itself. <small>(Illustrative simplification: TLS itself is often discussed at layers 5–6.)</small>","Browsers use HTTPS, phones look up names with DNS, mail servers relay with SMTP, chat apps usually ride on HTTPS."]];
